<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday Sayang ❤️</title>
  <style>
    body {
      margin: 0;
      font-family: 'Comic Sans MS', cursive;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      overflow: hidden;
      text-align: center;
      color: white;
    }

    h1 {
      margin-top: 20%;
      font-size: 3em;
      animation: bounce 1s infinite alternate;
    }

    p {
      font-size: 1.5em;
    }

    @keyframes bounce {
      from { transform: translateY(0px); }
      to { transform: translateY(-20px); }
    }

    .heart {
      position: absolute;
      color: red;
      font-size: 24px;
      animation: float 5s linear infinite;
    }

    @keyframes float {
      from {
        transform: translateY(100vh);
        opacity: 1;
      }
      to {
        transform: translateY(-10vh);
        opacity: 0;
      }
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background-color: #ff6b81;
      color: white;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background-color: #ff4757;
    }
  </style>
</head>
<body>

  <h1>🎉 Happy Birthday Sayang! 🎂</h1>
  <p>Kamu adalah hal terbaik yang pernah aku miliki 💖</p>
  <p>Semoga kamu selalu bahagia, sehat, dan tetap sayang aku 😆</p>

  <button onclick="showMessage()">Klik Aku Dong 😳</button>

  <audio id="music" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <script>
    function showMessage() {
      alert("Aku sayang kamu lebih dari apapun ❤️\nSelamat ulang tahun ya cintaku! 😘");
      document.getElementById("music").play();
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (Math.random() * 20 + 20) + "px";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }

    setInterval(createHeart, 300);
  </script>

</body>
</html>
